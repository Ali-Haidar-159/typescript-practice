<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create and review tasks.">
    <title>Task Flow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <p class="eyebrow">Task Flow</p>
        <h1>Create a task</h1>
        <p class="page-description">Add the task details and assign it to a user.</p>
      </header>

      <section class="task-panel" aria-labelledby="form-heading">
        <h2 id="form-heading">Task details</h2>
        <form id="task-form">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" placeholder="e.g. Prepare project update" required>

          <label for="department">Department</label>
          <input id="department" name="department" type="text" placeholder="e.g. Engineering" required>

          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="What needs to be done?" required></textarea>

          <label for="user">User</label>
          <input id="user" name="user" type="text" placeholder="Enter the user's name" required>

          <label for="status">Status</label>
          <select id="status" name="status" required>
            <option value="" disabled selected>Select status</option>
            <option value="completed">Completed</option>
            <option value="not-completed">Not completed</option>
          </select>

          <button type="submit">Create task</button>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="tasks-section" aria-labelledby="tasks-heading">
        <div class="section-heading">
          <h2 id="tasks-heading">Created tasks</h2>
          <span id="task-count" class="task-count">0</span>
        </div>
        <div id="task-list" class="task-list">
          <p id="empty-state" class="empty-state">Your tasks will appear here.</p>
        </div>
      </section>
    </main>

    <script  type="module"  src="../dist/index.js"></script>

  </body>
</html>
